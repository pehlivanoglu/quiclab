# FlowBot-like: one video server, two shared bottlenecks (r2 -> switch-a,
# r2 -> switch-b) with 10 clients each and PPBP cross traffic per bottleneck.
# Renditions follow a YouTube-like bitrate mix (mean ~2.9 Mb/s per client).
publishers:
  pub: { cc_algo: bbr }

subscribers:
  a00: { connects_to: pub, rate_kbps: 500, phase_ms: 0 }
  a01: { connects_to: pub, rate_kbps: 1000, phase_ms: 100 }
  a02: { connects_to: pub, rate_kbps: 1000, phase_ms: 200 }
  a03: { connects_to: pub, rate_kbps: 1000, phase_ms: 300 }
  a04: { connects_to: pub, rate_kbps: 2500, phase_ms: 400 }
  a05: { connects_to: pub, rate_kbps: 2500, phase_ms: 500 }
  a06: { connects_to: pub, rate_kbps: 2500, phase_ms: 600 }
  a07: { connects_to: pub, rate_kbps: 5000, phase_ms: 700 }
  a08: { connects_to: pub, rate_kbps: 5000, phase_ms: 800 }
  a09: { connects_to: pub, rate_kbps: 8000, phase_ms: 900 }
  b00: { connects_to: pub, rate_kbps: 500, phase_ms: 0 }
  b01: { connects_to: pub, rate_kbps: 1000, phase_ms: 100 }
  b02: { connects_to: pub, rate_kbps: 1000, phase_ms: 200 }
  b03: { connects_to: pub, rate_kbps: 1000, phase_ms: 300 }
  b04: { connects_to: pub, rate_kbps: 2500, phase_ms: 400 }
  b05: { connects_to: pub, rate_kbps: 2500, phase_ms: 500 }
  b06: { connects_to: pub, rate_kbps: 2500, phase_ms: 600 }
  b07: { connects_to: pub, rate_kbps: 5000, phase_ms: 700 }
  b08: { connects_to: pub, rate_kbps: 5000, phase_ms: 800 }
  b09: { connects_to: pub, rate_kbps: 8000, phase_ms: 900 }

routers:
  r1: {}
  r2:
    queue_metrics: { enabled: true, interval_ms: 25, queue_interval_ms: 5 }

switches:
  switch-a: {}
  switch-b: {}

traffic:
  senders: [{ id: tx-a }, { id: tx-b }]
  receivers: [{ id: rx-a }, { id: rx-b }]
  routes:
    cross-a: { path: [tx-a, r1, r2, switch-a, rx-a] }
    cross-b: { path: [tx-b, r1, r2, switch-b, rx-b] }

links:
  - { from: pub, to: r1 }
  - { from: r1, to: r2 }
  - { from: r2, to: switch-a }
  - { from: r2, to: switch-b }
  - { from: switch-a, to: a00 }
  - { from: switch-a, to: a01 }
  - { from: switch-a, to: a02 }
  - { from: switch-a, to: a03 }
  - { from: switch-a, to: a04 }
  - { from: switch-a, to: a05 }
  - { from: switch-a, to: a06 }
  - { from: switch-a, to: a07 }
  - { from: switch-a, to: a08 }
  - { from: switch-a, to: a09 }
  - { from: switch-b, to: b00 }
  - { from: switch-b, to: b01 }
  - { from: switch-b, to: b02 }
  - { from: switch-b, to: b03 }
  - { from: switch-b, to: b04 }
  - { from: switch-b, to: b05 }
  - { from: switch-b, to: b06 }
  - { from: switch-b, to: b07 }
  - { from: switch-b, to: b08 }
  - { from: switch-b, to: b09 }
  - { from: tx-a, to: r1 }
  - { from: tx-b, to: r1 }
  - { from: switch-a, to: rx-a }
  - { from: switch-b, to: rx-b }
