# Four clients behind one shared bottleneck (router -> switch), one control
# client on its own path, iperf3 endpoints across the shared bottleneck.
publishers:
  pub: { cc_algo: bbr2 }

subscribers:
  sub-a: { connects_to: pub, rate_kbps: 1000 }
  sub-b: { connects_to: pub, rate_kbps: 1000, phase_ms: 500 }
  sub-c: { connects_to: pub, rate_kbps: 1000, phase_ms: 1000 }
  sub-d: { connects_to: pub, rate_kbps: 1000, phase_ms: 1500 }
  sub-ctrl: { connects_to: pub, rate_kbps: 1000 }

routers:
  router:
    queue_metrics: { enabled: true, interval_ms: 25 }

switches:
  switch: {}

traffic:
  senders: [{ id: traffic-tx }]
  receivers: [{ id: traffic-rx }]
  routes:
    shared: { path: [traffic-tx, router, switch, traffic-rx] }

links:
  - { from: pub, to: router }
  - { from: router, to: switch }
  - { from: switch, to: sub-a }
  - { from: switch, to: sub-b }
  - { from: switch, to: sub-c }
  - { from: switch, to: sub-d }
  - { from: switch, to: traffic-rx }
  - { from: traffic-tx, to: router }
  - { from: router, to: sub-ctrl }
